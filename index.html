<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>3D Modular Weapon Builder</title>
    <link rel="stylesheet" href="styles.css" />

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="ui">
        <h2>3D Weapon Builder</h2>

        <div class="section-title">Parts</div>
        <div id="partPalette"></div>
        
        <div class="section-title">Custom Blades</div>
        <div id="customBladePalette"></div>

        <label>Custom Blade Name</label>
        <input id="customBladeName" type="text" placeholder="Example: Splitfang Blade" />
        
        <button id="completeBladeBtn">
            Complete and Save Blade
        </button>

        <button id="centerCameraBtn">Center Camera</button>

        <div class="section-title">Selected Part</div>
        <div id="selectedName">Nothing selected</div>

        <label class="checkbox-row">
            <input id="autoSnapToggle" type="checkbox" checked />
            Auto-snap new parts
        </label>

        <div class="section-title">Move</div>

        <label>Move X</label>
        <input id="moveX" type="range" min="-5" max="5" step="0.05" value="0" />

        <label>Move Y</label>
        <input id="moveY" type="range" min="-5" max="5" step="0.05" value="0" />

        <label>Move Z</label>
        <input id="moveZ" type="range" min="-5" max="5" step="0.05" value="0" />

        <div class="section-title">Rotate</div>

        <label>
            Rotate Y:
            <span id="rotYValue">0°</span>
        </label>
        <input id="rotY" type="range" min="0" max="360" step="1" value="0" />
        
        <label>
            Rotate Z:
            <span id="rotZValue">0°</span>
        </label>
        <input id="rotZ" type="range" min="0" max="360" step="1" value="0" />

        <label>
            Rotate X:
            <span id="rotXValue">0°</span>
        </label>
        <input id="rotX" type="range" min="0" max="360" step="1" value="0" />

        <div class="section-title">Scale</div>

        <label>Scale</label>
        <input id="scale" type="range" min="0.2" max="3" step="0.05" value="1" />

        <button id="deleteSelectedBtn" class="danger">Delete Selected</button>

        <div class="section-title">Build</div>
        <button id="saveBuildBtn">Save Build</button>
        <button id="loadBuildBtn">Load Build</button>
        <button id="exportBuildBtn">Export Build JSON</button>
        <button id="clearWeaponBtn" class="danger">Clear Weapon</button>

        <textarea id="buildJsonBox"
            placeholder="Saved build JSON will appear here. You can paste JSON here and click Load Build."></textarea>
    </div>

    <div id="info">
        Click a part to select it. Drag to rotate camera. Scroll to zoom.
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
